# Example: Create the SSH private key secret for router authentication.
#
# Option 1: Apply this file after filling in the base64-encoded key:
#   kubectl apply -f ssh-key-secret.example.yaml
#
# Option 2: Create directly from a key file (recommended):
#   kubectl create secret generic mikrotik-cert-controller-ssh-key \
#     --namespace=mikrotik-cert-controller \
#     --from-file=ssh-privatekey=/path/to/id_ed25519
#
# Option 3: Per-router override key:
#   kubectl create secret generic branch-router-ssh-key \
#     --namespace=mikrotik-cert-controller \
#     --from-file=ssh-privatekey=/path/to/branch_id_ed25519
#
# The key must be passwordless (no passphrase) for automated use.
# Ed25519 or RSA keys are supported.
apiVersion: v1
kind: Secret
metadata:
  name: mikrotik-cert-controller-ssh-key
  namespace: mikrotik-cert-controller
type: Opaque
data:
  # base64-encoded SSH private key:
  #   cat /path/to/id_ed25519 | base64 -w0
  ssh-privatekey: ""
