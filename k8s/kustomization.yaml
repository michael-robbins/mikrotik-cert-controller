apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mikrotik-cert-controller

resources:
  - namespace.yaml
  # Use rbac-namespace.yaml for namespace-scoped deployment (Recommended)
  # Or use rbac-cluster.yaml if cluster-wide Secrets access is required
  - rbac-namespace.yaml
  #- rbac-cluster.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: mikrotik-cert-controller
    behavior: create
    files:
      - config.yaml
      - known_hosts
    options:
      disableNameSuffixHash: true
