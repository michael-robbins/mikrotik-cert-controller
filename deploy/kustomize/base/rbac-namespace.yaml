apiVersion: v1
kind: ServiceAccount
metadata:
  name: mikrotik-cert-controller
  labels:
    app.kubernetes.io/name: mikrotik-cert-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mikrotik-cert-controller
  labels:
    app.kubernetes.io/name: mikrotik-cert-controller
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mikrotik-cert-controller
  labels:
    app.kubernetes.io/name: mikrotik-cert-controller
subjects:
  - kind: ServiceAccount
    name: mikrotik-cert-controller
roleRef:
  kind: Role
  name: mikrotik-cert-controller
  apiGroup: rbac.authorization.k8s.io
