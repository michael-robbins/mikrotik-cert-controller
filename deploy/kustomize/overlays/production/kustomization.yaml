apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: mikrotik-cert-controller
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: ghcr.io/yannick/mikrotik-cert-controller:v1.0.0
